<section id="careerStart" class="career-start" aria-label="Start your career"><div id="careerScene" aria-hidden="true"></div><nav class="display-controls" aria-label="Screen size"><button type="button" data-cloud>Cloud saves</button><button type="button" data-fullscreen>Full screen</button><a href="" target="_blank" rel="noopener">Open in new tab </a></nav><main id="careerEntry"></main></section>
<div hidden class="hc-shell" id="homeScreen">
  <div class="hc-main" id="homeFrame">
    <header class="hc-header">
      <div class="hc-bar">
        <div class="hc-chrome" id="hcChrome">
          <button class="tl-brand hc-chrome-item" type="button" data-hc-open="home" aria-label="Touchline 26 home"><span class="tl-brandmark"><svg class="hc-icon" aria-hidden="true"><use href="#tl-i-mark"/></svg></span><span><b>TOUCHLINE<span>26</span></b><small>FOOTBALL MANAGEMENT</small></span></button>
          <button class="tl-club-card hc-chrome-item" type="button" data-hc-open="club"><span id="homeHeaderCrest"></span><span><b>Independent manager</b><small>Season 2026/27</small></span></button>
          <button class="tl-manager hc-chrome-item" type="button" data-hc-open="profile"><span class="tl-initials" aria-hidden="true">◇</span><span><b>Manager</b><small>Independent</small></span></button>
          <button class="hc-tool hc-more" type="button" id="homeMore" aria-expanded="false" aria-controls="homeMorePanel" aria-label="Club menu" title="Club menu"><svg class="hc-icon" aria-hidden="true"><use href="#hc-i-menu"/></svg></button>
          <div class="hc-more-panel" id="homeMorePanel" hidden>
            <button type="button" data-hc-open="profile">Manager profile</button>
            <button type="button" id="newManager">Main menu</button>
            <button type="button" data-cloud>Cloud saves</button>
            <button type="button" data-fullscreen>Full screen</button>
            <a href="" target="_blank" rel="noopener">Open in new tab</a>
          </div>
        </div>
        <div class="hc-history" aria-label="Navigation history">
          <button class="hc-tool hc-back" type="button" id="homeBack" disabled aria-label="Back">Back</button>
          <button class="hc-tool" type="button" id="homeForward" disabled aria-label="Forward">Forward</button>
        </div>
        <div class="hc-location"><p id="homeSection">Clubhouse</p><h1 id="homeTitle" tabindex="-1">Home</h1></div>
        <button class="hc-tool hc-search" type="button" data-hc-open="search" aria-label="Search the club dashboard" title="Search the club dashboard"><svg class="hc-icon" aria-hidden="true"><use href="#hc-i-search"/></svg><span>Find a page</span></button>
        <button class="hc-tool hc-help" type="button" data-hc-open="help" aria-label="Clubhouse help" title="Clubhouse help"><svg class="hc-icon" aria-hidden="true"><use href="#hc-i-help"/></svg></button>
        <button type="button" id="homeCalendarLink" class="hc-clock-link" aria-label="Open calendar desk" title="Open calendar desk"><svg class="hc-icon" aria-hidden="true"><use href="#hc-i-calendar"/></svg><time class="hc-clock" id="homeClock"><span id="homeDay"></span><strong id="homeDate"></strong></time></button>
        <button type="button" hidden id="headerWallet" class="hc-wallet" data-life="go" data-v="finance" aria-label="Personal wallet. Open accounts"></button>
        <button class="hc-continue" id="homeContinue" type="button"><span>Continue</span><span class="continue-ball" aria-hidden="true">⚽</span><svg hidden aria-hidden="true"><use id="homeContinueIcon"/></svg></button>
      </div>
      <nav id="homeNav" aria-label="Sections"></nav>
      <nav class="hc-tabs" id="homeTabs" aria-label="Section tabs"></nav>
    </header>
    <main class="hc-content tl-home" id="homeMain" aria-labelledby="homeTitle"></main>
    <main class="hc-content cc-workspace" id="clubPage" aria-labelledby="homeTitle" hidden></main>
    <main class="hc-content tl-processing" id="homeProcessing" aria-labelledby="processingTitle" hidden>
      <div class="tl-processing-wrap">
        <div class="tl-processing-kicker"><span class="tl-running" aria-hidden="true"><i></i><i></i><i></i></span> SEASON CLOCK <span></span> RIVERSIDE FC</div>
        <div class="tl-processing-heading"><div><h2 id="processingTitle">Processing calendar</h2><p>Training, club business and fixtures around the league.</p></div><div class="tl-processing-count" id="processingCount"></div></div>
        <div class="tl-processing-line" aria-hidden="true"></div>
        <div id="processingDays" class="tl-processing-days"></div>
        <div class="tl-processing-foot"><p><span>Automatic stops</span> Required decisions · Matchday · Season end<small id="processingTarget" hidden></small></p><button type="button" class="cc-btn cc-btn-outline" id="homeStop">Stop here <kbd>Esc</kbd></button></div>
        <p class="hc-sr" id="processingSpeech" role="status"></p>
      </div>
    </main>
  </div>
  <p id="clubStatus" class="cc-toast" role="status" hidden></p>

  <dialog class="hc-dialog" id="homeDialog" aria-labelledby="homeDialogTitle">
    <header class="hc-dialog-head"><div><p id="homeDialogTag">Independent manager</p><h2 id="homeDialogTitle"></h2></div><button class="hc-tool" id="homeDialogClose" type="button" aria-label="Close club panel" autofocus><svg class="hc-icon" aria-hidden="true"><use href="#i-close"/></svg></button></header>
    <div class="hc-dialog-body" id="homeDialogBody"></div>
  </dialog>
</div>
